# Static host for the built Launchpad frontend (frontend/dist).
#
# The API is NOT proxied here: the browser talks to the ao-server backend
# directly at the VITE_API_BASE_URL baked in at build time, which is what
# makes ao-server's `CorsLayer::permissive()` (crates/ao-server/src/routes/mod.rs)
# the whole CORS story — cross-origin requests from this origin to the
# backend port are allowed as-is.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite fingerprints everything under /assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router owns client-side routes: unknown paths get index.html,
    # never nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
